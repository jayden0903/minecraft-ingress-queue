# FairQueue (Velocity) 설정. 이 파일은 UTF-8로 읽습니다.
# 상대 경로는 모두 플러그인 데이터 폴더(plugins/fairqueue/) 기준입니다.

# 메인 서버 정원(1~200). 예약 중인 접속도 한 자리를 차지합니다.
capacity=100
# velocity.toml [servers]에 등록한 이름
main-server=survival
lobby-server=queue

# (선택) 메인 서버 폴더. server.properties, ops.json, whitelist.json,
# banned-players.json, banned-ips.json을 2초마다 읽어 화이트리스트/차단/관리자/MOTD를 맞춥니다.
# 비워 두면 접근 정책 없이 모두 받습니다(정품 인증은 Velocity가 따로 합니다).
access-root=
# access-root가 없을 때 쓰는 MOTD(§ 색상 코드 가능)
motd=A Minecraft Server

# 입장표(entry ticket) 서명 키: 정확히 32바이트. Router와 같은 파일을 써야 합니다.
ticket-key-file=entry-ticket.key
# 입장표 없이 들어온 접속에게 안내할 입구 주소
entry-host=entry.example.com
# 경로 호스트 목록(쉼표 구분). 접속자 0명이어도 API에 표시됩니다.
route-hosts=s1.example.com,s2.example.com,s3.example.com,s4.example.com,s5.example.com,s6.example.com,s7.example.com,s8.example.com,s9.example.com,s10.example.com
# Router가 조회하는 경로 API 포트(127.0.0.1에만 열림)
route-api-port=8765
# 경로별 누적 송신 바이트 기록(옆에 .bak 사본이 함께 생깁니다)
traffic-file=traffic-totals.properties

# 우선 입장 명단(JSON). 파일이 없으면 모두 일반 대기입니다.
priority-file=priority.json
# 1초마다 갱신되는 대기열 상태
status-file=status.json

# 보스바와 안내 문구 앞에 붙는 짧은 이름
display-name=대기열
# 우선 입장 안내 뒤에 붙일 문구(비우면 생략)
priority-hint-suffix=

# (선택) F3 화면의 서버 브랜드를 바꿉니다. 비우면 그대로 둡니다. 예: §6example.com§r
server-brand=
# (선택) 서버 목록 버전 표시. ViaVersion 등으로 여러 버전을 받을 때 씁니다.
# 비우면 Velocity 기본값을 그대로 둡니다.
ping-version-name=
ping-protocol-min=0
ping-protocol-max=0
